[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "vela-jax"
description = "Vela.jl's deterministic timing-delay engine, in JAX"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Rutger van Haasteren" }]
dynamic = ["version"]
dependencies = [
    "numpy>=1.24",
    "jax>=0.4.30",
    "pint-pulsar>=1.0",
    "astropy>=5.3",
    # The pulsar record, the feather schema and the pure par-text rules. It
    # pulls in pyarrow and nothing else; the record type is shared with
    # MetaPulsar and nltiming so a feather written here is not this package's
    # private format.
    "psrdata @ git+https://github.com/nanograv/psrdata.git@main",
]

[project.optional-dependencies]
oracle = ["pyvela", "juliacall"]
# The three properties `read_tempo2` needs (siteVel, correction_tt,
# correction_tt_tb) are not in a libstempo release yet; the engine
# refuses by name rather than guessing when they are absent.
tempo2 = ["libstempo"]
dev = ["pytest", "pytest-xdist", "black", "ruff"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: no par/tim ingest -- pure algebra, text rules and frozen-record shape",
    "oracle: needs pyvela/Julia",
    "tempo2: needs libstempo and a tempo2 installation",
    "no_tempo2: in a tempo2 module but needs no tempo2 (pure text rules)",
    "slow: breadth rather than behaviour -- the full fixture sweep, run at checkpoints",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E741"]
